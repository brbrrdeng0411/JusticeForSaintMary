:var(--cyan)}.panel h3{margin:0 0 9px;font-size:14px}.muted{color:var(--quiet)}.mini{font-size:11px}.small{font-size:12px}.row{display:flex;align-items:center;gap:8px}.grow{flex:1}.wrap{flex-wrap:wrap}.space{justify-content:space-between}.buttons{display:flex;gap:7px}.btn{border:1px solid #70879a;background:#1c2c3a;color:#dceaf2;padding:10px 11px;min-height:44px;border-radius:2px;font-weight:750}.btn.primary{background:linear-gradient(#39b6d4,#15789a);border-color:#80d7ed;color:white}.btn.warn{background:linear-gradient(#6d2739,#48212a);border-color:#b85c6e}.btn.ghost{background:transparent}.btn.fill{flex:1}.btn.full{width:100%}.btn.tiny{min-height:33px;padding:5px 9px;font-size:12px}.btn.chosen{outline:2px solid #a9e8fb}.bar{height:9px;border:1px solid #4b6477;background:#06111b;overflow:hidden}.bar>i{display:block;height:100%;background:linear-gradient(90deg,#247b9e,#5ad6f1);transition:width .25s}.stages{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.stages button{background:#162332;border:1px solid #455c6d;color:#9fb6c8;min-height:48px;font-weight:900}.stages button.selected{border-color:var(--cyan);color:white;background:#214658}.stages button.done{box-shadow:inset 0 -3px #91d8a2}.stages button.locked{opacity:.35}.portrait{display:flex;min-height:120px;background:linear-gradient(120deg,var(--soft,#222e42),#151e2b);position:relative;overflow:hidden;border:1px solid #64758a;margin:10px 0}.portrait:after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(transparent 0 14px,#ffffff07 15px 16px);pointer-events:none}.portrait .sigil{width:36%;display:grid;place-items:center;position:relative;filter:drop-shadow(0 0 8px var(--main,#aaa))}.sigil i{display:block;width:67px;height:92px;clip-path:polygon(33% 0,66% 0,82% 23%,100% 70%,80% 100%,20% 100%,0 70%,18% 23%);background:linear-gradient(145deg,var(--main,#ddd),#12161c 75%);border:2px solid #ffffff99;opacity:.9}.sigil b{position:absolute;font-size:28px;top:30px;color:#ffffffdd}.portrait .charcopy{flex:1;padding:20px 8px 12px 0;z-index:1}.charcopy h3{margin:0 0 4px;font-size:20px}.charcopy .unit{color:var(--main,#fff);font-size:10px;letter-spacing:1px;font-weight:900}.charcopy p{color:#c2cbd7;font-size:11px;margin:8px 0 0}.note{font-size:12px;line-height:1.55;color:#b7c7d4;margin:7px 0}.score{animation:scorePop .3s ease-out;font-size:38px;font-weight:900;letter-spacing:1px;text-align:center;color:var(--cyan);font-variant-numeric:tabular-nums;line-height:1.1}.clear{color:var(--ok)}.fail{color:var(--fail)}.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.card{min-height:116px;text-align:left;padding:10px 8px;border:1px solid #5a7888;background:linear-gradient(140deg,var(--soft,#293240),#101925 72%);color:white;position:relative;box-shadow:inset 0 3px var(--main,#86a9cc)}.card .idx{font-size:9px;color:#cad6db;letter-spacing:.7px}.card strong{display:block;font-size:13px;line-height:1.3;margin:11px 0 7px;word-break:keep-all}.card .detail{color:#ecf1fa;font-size:11px;line-height:1.4}.card:disabled{opacity:.42}.card:hover:not(:disabled){border-color:#b5f1fc}.card .category{position:absolute;bottom:4px;right:6px;font-size:9px;opacity:.7}.deckslots{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px}.slot{font-size:10px;min-height:65px;padding:5px 2px;border:1px solid #527084;background:linear-gradient(#243c4c,#122332);color:white;word-break:keep-all}.slot.on{border:2px solid var(--cyan);background:#204456}.slot b{display:block;font-size:9px;color:#9edee7;margin-bottom:4px}.cardpool{max-height:340px;overflow:auto;display:grid;grid-template-columns:repeat(2,1fr);gap:7px}.poolcard{min-height:62px;border:1px solid #4a6576;background:#111e2a;color:#d9e9ef;text-align:left;padding:8px}.poolcard span{display:block;color:#9db3c3;font-size:10px;margin-top:4px}.poolcard.used{opacity:.5}.boxlist{display:flex;flex-wrap:wrap;gap:5px}.chip{background:#233849;border:1px solid #4c6e83;padding:4px 7px;color:#bfd9e6;font-size:11px}.log{max-height:218px;overflow:auto}.event{display:grid;grid-template-columns:42px 1fr;gap:8px;border-bottom:1px solid #364958;padding:7px 0;font-size:11px;color:#bdcfdb}.event b{color:#71d4ed}.field{display:flex;flex-direction:column;gap:5px;margin-bottom:10px;min-width:0}.field label{font-size:11px;color:#afc4d0}.field input,.field select{padding:11px;min-height:44px;border-radius:2px;border:1px solid #607f92;background:#0c1723;color:#ecf6fa;width:100%}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px}.record{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid #45596c}.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.kpi{border:1px solid #365467;text-align:center;padding:10px 3px}.kpi b{font-size:22px;display:block}.kpi span{font-size:10px;color:#a1b1be}.story{font-size:13px;color:#cedce5;line-height:1.8;border-left:2px solid #8db2ca;padding-left:12px}.warntext{color:#f6c6ac}.hidden{display:none!important}#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:22px;background:#213e4a;color:white;border:1px solid #82ddef;padding:13px 16px;z-index:50;width:min(94vw,480px);box-shadow:0 6px 30px #000c}.characterchoices{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.choice{padding:15px 4px;border:1px solid var(--main,#567);background:linear-gradient(var(--soft,#123),#121c28);color:#fff;text-align:center;font-size:12px;min-height:90px}.choice b{display:block;font-size:16px;margin-bottom:8px}.loadlist{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}.loadchar{min-height:72px;padding:10px;text-align:left;background:linear-gradient(105deg,var(--soft,#234),#0c1824);color:white;border:1px solid #597080}.loadchar.on{outline:2px solid var(--main,#7cd)}.loadchar b{display:block;margin-bottom:5px}.statline{font-size:11px;color:#bacfda;line-height:1.7}.handtip{text-align:center;color:#aacad9;font-size:12px;margin-bottom:9px}.accent{color:var(--cyan)}.foot{font-size:10px;color:#8c9ea8;text-align:center;padding:12px}.steps{display:flex;gap:4px}.steps>span{flex:1;height:4px;background:#34485c}.steps>span.done{background:#58d5f0}@keyframes scorePop{from{filter:brightness(2);transform:scale(1.035)}to{filter:brightness(1);transform:scale(1)}}@media(max-width:365px){main{padding:11px 8px}.card{min-height:122px;padding:8px 5px}.card strong{font-size:11px}.card .detail{font-size:10px}.tabs button{font-size:11px}.slot{font-size:9px}.panel{padding:10px}}
</style>
</head>
<body><div class="shell"><header class="top"><div class="eyebrow">TACTICAL ARCHIVE / FAN PROTOTYPE</div><h1>SIMULATION ROOM</h1><small>JUSTICE FOR SAINT MARY · TEST BUILD 0.2</small></header><nav class="tabs"><button data-tab="mission" class="active">작전 / 덱</button><button data-tab="lab">카드 제작 · 실험실</button><button data-tab="records">기록 / 세이브</button></nav><main id="app"></main><div class="foot">Unofficial fan prototype · no original art / audio assets included</div></div><div id="toast" class="hidden" role="status"></div>
<script>
(()=>{'use strict';
const KEY='JFSM_SAVE_V3',TURNS=12,START=['shot','reload','r_open','r_hold','r_chain','r_finish'];
const characters={
rapi:{name:'라피',edition:'RED HOOD',type:'호조',main:'#df5264',soft:'#62313c',icon:'R',description:'진홍의 공격 리듬',active:'호조 +3 · 다음 공격 +20'},
rapunzel:{name:'라푼젤',edition:'SANCTUARY · 4TH',type:'호인상',main:'#e8cf96',soft:'#3a5159',icon:'✦',description:'흰 후드 / 검은 장갑 / 성역의 금빛',active:'호인상 +7 · 즉시 호인상×3 점수'},
scarlet:{name:'홍련',edition:'GODDEATH · 4TH',type:'방밀',main:'#e9e6db',soft:'#752a31',icon:'╱',description:'은백색·진홍색 검객 갑주',active:'보호막×5 점수 / 전부 소비'},
dorothy:{name:'도로시',edition:'4TH STORY THEME',type:'온강',main:'#d982c4',soft:'#352444',icon:'D',description:'4주년 서사 테마 · 자주/먹보라',active:'비축×5 점수 / 전부 소비'},
marian:{name:'마리안',edition:'QUEEN · 4TH',type:'최종 목표',main:'#a88eeb',soft:'#241a38',icon:'Q',description:'퀸 버전 · 검은 금속과 은보라',active:''}};
function card(id,name,group,description,effect,value,extra=0){return {id,name,group,description,effect,value,extra}}
const cards=[
card('shot','기본 사격','base','공격 +10','attack',10),card('reload','재장전','base','공격 +4 / 다음 공격 +8','reload',4,8),
card('r_open','전술 개시','rapi','호조 +4턴','hojo',4),card('r_hold','전술 유지','rapi','호조 +3턴 / 공격 +4','hold',3,4),card('r_chain','연속 제압','rapi','공격 +12 / 호조 중 +10','chain',12,10),card('r_finish','집중사격','rapi','공격 +20 / 호조 중 +20','chain',20,20),
card('p_pray','기도의 시작','rapunzel','호인상 +5','impression',5),card('p_chain','축복의 연쇄','rapunzel','호인상 +4','impression',4),card('p_lock','영원한 기도','rapunzel','호인상 3턴 감소 방지','lock',3),card('p_finish','구원의 순간','rapunzel','호인상×4 공격 / 절반 소비','imBurst',4),
card('s_guard','검의 수호','scarlet','보호막 +12','shield',12),card('s_flow','흐르는 기세','scarlet','보호막 +8 / 공격 +4','shieldAtk',8,4),card('s_double','부동의 자세','scarlet','보호막 ×2','shieldMult',2),card('s_finish','붉은 일섬','scarlet','보호막×4 공격 / 전부 소비','shieldBurst',4),
card('d_keep','온존','dorothy','비축 +8','reserve',8),card('d_gather','추가 비축','dorothy','비축 +8','reserve',8),card('d_strong','강기 전환','dorothy','다음 2회 공격 ×2','strong',2),card('d_finish','최후의 탄환','dorothy','공격 10+비축×5 / 소비','reserveBurst',5,10)
];
const stages=[
{boss:'rapunzel',name:'기도의 잔향',goal:32000,unlock:'rapunzel',desc:'4턴 종료 시 호조 유지 보너스 +2,000'},
{boss:'scarlet',name:'이어지는 검',goal:45000,unlock:'scarlet',desc:'6턴 종료 시 호인상 4 이상 보너스 +4,000'},
{boss:'dorothy',name:'낙원의 문',goal:55000,unlock:'dorothy',desc:'4·10턴 보호막 -8 / 8턴 종료 시 보호막 20 이상 +5,000'},
{boss:'marian',name:'마지막 신호',goal:70000,unlock:null,desc:'10턴에 단일 공격 50 이상 기록 시 +8,000'}
];
const fmt=n=>Math.round(n).toLocaleString('ko-KR');const html=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uniq=a=>[...new Set(a)];const clamp=(n,min,max)=>Math.min(max,Math.max(min,Number(n)||0));
function fresh(){return {version:3,stage:0,unlockedStage:0,cleared:[],unlockedGroups:['base','rapi'],heroes:['rapi'],hero:'rapi',mode:'passive',deck:[...START],best:[0,0,0,0],runs:0,custom:[],labDeck:[...START],labStage:0,labHero:'rapi',labMode:'passive',battleSeed:34941}}
function read(){try{const v=JSON.parse(localStorage.getItem(KEY)||'null');if(!v||v.version!==3)return fresh();return normalizeSave(v)}catch{return fresh()}}
function normalizeSave(v){const f=fresh();const s={...f,...v};s.stage=clamp(s.stage,0,3);s.unlockedStage=clamp(s.unlockedStage,0,3);s.stage=Math.min(s.stage,s.unlockedStage);s.cleared=uniq((Array.isArray(s.cleared)?s.cleared:[]).filter(n=>Number.isInteger(n)&&n>=0&&n<4));s.unlockedGroups=uniq(['base','rapi',...(Array.isArray(s.unlockedGroups)?s.unlockedGroups:[]).filter(n=>['rapunzel','scarlet','dorothy'].includes(n))]);s.heroes=uniq(['rapi',...(Array.isArray(s.heroes)?s.heroes:[]).filter(n=>['rapunzel','scarlet','dorothy'].includes(n))]);s.hero=s.heroes.includes(s.hero)?s.hero:'rapi';s.mode=['active','passive'].includes(s.mode)?s.mode:'passive';s.best=Array.from({length:4},(_,i)=>clamp(s.best?.[i],0,999999999));s.runs=clamp(s.runs,0,999);s.custom=(Array.isArray(s.custom)?s.custom:[]).slice(0,50).filter(c=>c&&typeof c.id==='string'&&typeof c.name==='string'&&allowedEffects.includes(c.effect)).map(c=>({...c,id:c.id.slice(0,80),name:c.name.slice(0,30),value:clamp(c.value,0,999)}));s.deck=normalizeDeck(Array.isArray(s.deck)?s.deck:[],s.unlockedGroups);s.labDeck=normalizeLabDeck(Array.isArray(s.labDeck)?s.labDeck:[],s.custom);s.labStage=clamp(s.labStage,0,3);s.labHero=characters[s.labHero]&&s.labHero!=='marian'?s.labHero:'rapi';s.labMode=['active','passive'].includes(s.labMode)?s.labMode:'passive';s.battleSeed=Math.floor(clamp(s.battleSeed,1,4294967295));return s}
function normalizeDeck(ids,groups){const ok=cards.filter(c=>groups.includes(c.group)).map(c=>c.id);const d=uniq(ids.filter(x=>ok.includes(x)));for(const id of ok)if(d.length<6&&!d.includes(id))d.push(id);return d.slice(0,6)}
function normalizeLabDeck(ids,custom){const ok=[...cards,...custom].map(c=>c.id);const d=uniq(ids.filter(x=>ok.includes(x)));for(const id of ok)if(d.length<6&&!d.includes(id))d.push(id);return d.slice(0,6)}
const allowedEffects=['customAttack','customHojo','customImpression','customShield','customReserve','customMult','customBurstShield','customBurstReserve'];
const effectNames={customAttack:'직접 공격',customHojo:'호조 +턴',customImpression:'호인상 +',customShield:'보호막 +',customReserve:'비축 +',customMult:'다음 공격 +',customBurstShield:'보호막× 공격 / 소비',customBurstReserve:'비축× 공격 / 소비'};
let save=read(),page='mission',screen='prep',battle=null,last=null,selectedSlot=-1,editCard=null,labResult=null,toastTimer;
function persist(){try{localStorage.setItem(KEY,JSON.stringify(save))}catch{}};
function toast(s){const el=document.getElementById('toast');el.textContent=s;el.classList.remove('hidden');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.add('hidden'),2300)}
function allCards(lab=false){return lab?[...cards,...save.custom]:cards}
function getCard(id,lab=false){return allCards(lab).find(c=>c.id===id)}
function palette(group){const c=characters[group]||{main:'#58d6f0',soft:'#20384b'};return `--main:${c.main};--soft:${c.soft}`}
function panel(s){return `<section class="panel">${s}</section>`}
function portrait(id){const c=characters[id];return `<div class="portrait" style="${palette(id)}"><div class="sigil"><i></i><b>${html(c.icon)}</b></div><div class="charcopy"><div class="unit">${html(c.edition)}</div><h3>${html(c.name)}</h3><p>${html(c.description)}</p></div></div>`}
function stageHeader(){return `<div class="secthead"><h2>OPERATION / SECTOR ${save.stage+1}</h2><span class="tag">${save.runs}회 완주 · ${save.heroes.length}/4 UNIT</span></div><div class="stages">${stages.map((s,i)=>`<button data-stage="${i}" class="${i===save.stage?'selected':''} ${save.cleared.includes(i)?'done':''} ${i>save.unlockedStage?'locked':''}" ${i>save.unlockedStage?'disabled':''}>${i+1} / ${html(characters[s.boss].name)}</button>`).join('')}</div>`}
function renderPrep(){const st=stages[save.stage];const available=cards.filter(c=>save.unlockedGroups.includes(c.group));return `${stageHeader()}${panel(`<div class="row space"><b>SECTOR 0${save.stage+1} · ${html(st.name)}</b><span class="tag">목표 ${fmt(st.goal)}</span></div>${portrait(st.boss)}<p class="note">${html(st.desc)} · 최고기록 ${fmt(save.best[save.stage])}점</p><div class="steps">${stages.map((s,i)=>`<span class="${save.cleared.includes(i)?'done':''}"></span>`).join('')}</div>`)}${panel(`<h3>01 / 출격 인원 선택</h3><div class="loadlist">${save.heroes.map(k=>`<button class="loadchar ${save.hero===k?'on':''}" data-hero="${k}" style="${palette(k)}"><b>${html(characters[k].name)} <span class="mini muted">${html(characters[k].edition)}</span></b><span class="mini">${html(characters[k].type)}</span></button>`).join('')}</div><div class="row wrap" style="margin-top:10px"><button class="btn tiny ${save.mode==='passive'?'chosen':''}" data-mode="passive">고유 패시브</button><button class="btn tiny ${save.mode==='active'?'chosen':''}" data-mode="active">고유 액티브 (전투 중 1회)</button></div><p class="note">${save.mode==='active'?html(characters[save.hero].active):'상시 패시브: 캐릭터 콘셉트 효과 강화'}</p>`)}${panel(`<div class="secthead"><h3>02 / 출격 덱 6장</h3><span class="mini muted">슬롯 선택 → 아래 카드 교체</span></div><div class="deckslots">${save.deck.map((id,i)=>{const c=getCard(id);return `<button class="slot ${selectedSlot===i?'on':''}" data-slot="${i}"><b>${i+1}</b>${html(c?.name||'?')}</button>`}).join('')}</div><p class="note">드래그 대신 슬롯을 두 번 눌러 교환하거나, 슬롯을 누른 뒤 아래 카드로 교체합니다.</p><div class="cardpool">${available.map(c=>`<button data-pick="${html(c.id)}" class="poolcard ${save.deck.includes(c.id)?'used':''}" style="${palette(c.group)};border-left:3px solid var(--main)"><b>${html(c.name)}</b><span>${html(c.description)}</span></button>`).join('')}</div>`)}${panel(`<div class="row space"><span class="small">매 턴 3장 드로우 → 직접 1장 사용</span><span class="tag">12 TURN</span></div><p class="note">남은 두 장은 덱으로 돌아가고 사용한 카드는 버린 카드 더미로 이동합니다. 더미가 부족해지면 버린 카드를 섞습니다. 전투당 액티브 1회를 직접 누를 수 있습니다.</p><div class="buttons"><button class="btn fill" id="reroll">시드 변경</button><button class="btn primary fill" id="start">출격 ▶</button></div>`)} `}
function makeRng(seed){let x=(seed>>>0)||1;return ()=>{x^=x<<13;x^=x>>>17;x^=x<<5;return(x>>>0)/4294967296}}
function shuffle(a,rng){for(let i=a.length-1;i>0;i--){const j=Math.floor(rng()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function newBattle({deck,hero,mode,stage,seed,lab=false}){const selected=normalizeLabDeck(deck,save.custom);const valid=lab?selected:normalizeDeck(deck,save.unlockedGroups);if(valid.length!==6)throw Error('덱 6장을 채워주세요');const rng=makeRng(seed);const b={deck:valid,hero,mode,stage,seed,lab,turn:1,score:0,hojo:0,impression:0,lock:0,shield:0,reserve:0,strong:0,next:0,activeUsed:false,hand:[],drawPile:shuffle([...valid],rng),discard:[],rng,history:[],done:false,bonus:[],lastHit:0};drawHand(b);return b}
function drawHand(b){b.hand=[];while(b.hand.length<3){if(!b.drawPile.length){b.drawPile=shuffle(b.discard.splice(0),b.rng);if(!b.drawPile.length)break}b.hand.push(b.drawPile.pop())}return b.hand}
function scoreGain(b,n,logs,label){const v=Math.max(0,Math.floor(n));b.score+=v;logs.push(`${label} +${fmt(v*100)}`);return v}
function attack(b,n,logs,label='공격'){let v=Math.max(0,n+b.next);b.next=0;if(b.mode==='passive'&&b.hero==='rapi'&&b.hojo>0)v+=5;if(b.hojo>0)v=Math.floor(v*1.5);if(b.strong>0){v*=2;b.strong--}v=scoreGain(b,v,logs,label);b.lastHit=Math.max(b.lastHit,v);if(b.stage===3&&b.turn===10&&v>=50&&!b.bonus.includes('queen')){scoreGain(b,80,logs,'QUEEN BREAK');b.bonus.push('queen')}}
function effect(b,c,logs){const v=Number(c.value)||0,x=Number(c.extra)||0;const shield=(n)=>{b.shield+=n;if(b.mode==='passive'&&b.hero==='scarlet')b.shield+=4};const reserve=(n)=>{b.reserve+=n;if(b.mode==='passive'&&b.hero==='dorothy')b.reserve+=3};switch(c.effect){case'attack':case'customAttack':attack(b,v,logs);break;case'reload':attack(b,v,logs);b.next+=x;break;case'hojo':case'customHojo':b.hojo+=v;logs.push(`호조 +${v}T`);break;case'hold':b.hojo+=v;attack(b,x,logs);break;case'chain':attack(b,v+(b.hojo>0?x:0),logs);break;case'impression':case'customImpression':b.impression+=v;logs.push(`호인상 +${v}`);break;case'lock':b.lock+=v;logs.push(`호인상 유지 ${v}T`);break;case'imBurst':attack(b,b.impression*v,logs);b.impression=Math.floor(b.impression/2);break;case'shield':case'customShield':shield(v);logs.push(`보호막 +${v}`);break;case'shieldAtk':shield(v);attack(b,x,logs);break;case'shieldMult':b.shield=Math.floor(b.shield*v);logs.push(`보호막 ×${v}`);break;case'shieldBurst':case'customBurstShield':attack(b,b.shield*v,logs);b.shield=0;break;case'reserve':case'customReserve':reserve(v);logs.push(`비축 +${v}`);break;case'strong':b.strong+=v;logs.push(`강기 ${v}회`);break;case'reserveBurst':attack(b,x+b.reserve*v,logs);b.reserve=0;break;case'customMult':b.next+=v;logs.push(`다음 공격 +${v}`);break;case'customBurstReserve':attack(b,b.reserve*v,logs);b.reserve=0;break;default:throw Error('잘못된 카드 효과: '+c.effect)}}
function turnBegin(b,logs){if(b.stage===2&&(b.turn===4||b.turn===10)){const lost=Math.min(8,b.shield);b.shield-=lost;logs.push(`보스 파훼: 보호막 -${lost}`)}}
function turnEnd(b,logs){if(b.stage===0&&b.turn===4&&b.hojo>0){scoreGain(b,20,logs,'호조 보너스')}if(b.stage===1&&b.turn===6&&b.impression>=4){scoreGain(b,40,logs,'호인상 보너스')}if(b.stage===2&&b.turn===8&&b.shield>=20){scoreGain(b,50,logs,'보호막 보너스')}if(b.impression>0){scoreGain(b,b.impression*(b.hero==='rapunzel'&&b.mode==='passive'?5:3),logs,'호인상 턴 점수');if(b.lock>0)b.lock--;else b.impression=Math.max(0,b.impression-1)}if(b.hojo>0)b.hojo--}
function useActive(b){if(b.mode!=='active'||b.activeUsed||b.done)throw Error('액티브 사용 불가');const logs=[];b.activeUsed=true;switch(b.hero){case'rapi':b.hojo+=3;b.next+=20;logs.push('레드후드: 호조 +3 / 다음 공격 +20');break;case'rapunzel':b.impression+=7;scoreGain(b,b.impression*3,logs,'생츄어리');break;case'scarlet':scoreGain(b,b.shield*5,logs,'신살');b.shield=0;break;case'dorothy':scoreGain(b,b.reserve*5,logs,'낙원의 잔상');b.reserve=0;break}b.history.push({turn:b.turn,card:'고유 액티브',details:logs.join(' · '),score:b.score*100,active:true});return b}
function playCard(b,id){if(b.done||!b.hand.includes(id))throw Error('현재 손패에서 선택해주세요');const c=getCard(id,b.lab);if(!c)throw Error('없는 카드');const before=b.score,log=[];turnBegin(b,log);effect(b,c,log);turnEnd(b,log);b.history.push({turn:b.turn,card:c.name,details:log.join(' · ')||'효과 없음',gained:(b.score-before)*100,score:b.score*100});b.discard.push(id);for(const other of b.hand)if(other!==id)b.drawPile.unshift(other);b.hand=[];if(b.turn===TURNS){b.done=true}else{b.turn++;drawHand(b)}return b}
function completeBattle(b){return {total:b.score*100,cleared:b.score*100>=stages[b.stage].goal,stage:b.stage,hero:b.hero,mode:b.mode,history:b.history,lab:b.lab,seed:b.seed}}
function renderBattle(){const st=stages[battle.stage];const hero=characters[battle.hero];return `<div class="secthead"><h2>${battle.lab?'LAB /':'COMBAT /'} ${html(st.name)}</h2><span class="tag">TURN ${battle.turn}/${TURNS}</span></div>${panel(`<div class="row space"><span class="mini">${html(hero.name)} → ${html(characters[st.boss].name)}</span><span class="tag">${fmt(st.goal)} 목표</span></div><div class="score">${fmt(battle.score*100)}</div><div class="bar"><i style="width:${Math.min(100,battle.score*100/st.goal*100)}%"></i></div><div class="row space" style="margin-top:11px"><span class="mini muted">남은 드로우 ${battle.drawPile.length}</span><span class="mini muted">버린 카드 ${battle.discard.length}</span></div>`)}${panel(`<h3>상태 / STATUS</h3><div class="boxlist"><span class="chip">호조 ${battle.hojo}T</span><span class="chip">호인상 ${battle.impression}</span><span class="chip">보호막 ${battle.shield}</span><span class="chip">비축 ${battle.reserve}</span><span class="chip">강기 ${battle.strong}</span><span class="chip">다음 공격 +${battle.next}</span></div><p class="note">${html(st.desc)}</p>`)}${panel(`<div class="secthead"><h3>매 턴 3장 드로우</h3><span class="tag">1장 선택</span></div><div class="handtip">카드를 누르면 즉시 효과가 발동하고 다음 턴 손패를 뽑습니다.</div><div class="cards">${battle.hand.map(id=>{const c=getCard(id,battle.lab);return `<button class="card" data-play="${html(id)}" style="${palette(c.group)}"><span class="idx">PLAY CARD</span><strong>${html(c.name)}</strong><span class="detail">${html(c.description)}</span><span class="category">${html(characters[c.group]?.type||'공용')}</span></button>`}).join('')}</div><div style="margin-top:10px">${battle.mode==='active'?`<button class="btn full ${battle.activeUsed?'ghost':'primary'}" id="active" ${battle.activeUsed?'disabled':''}>${battle.activeUsed?'고유 액티브 사용 완료':'고유 액티브 발동 · '+html(hero.active)}</button>`:`<div class="note">고유 패시브 발동 중 · ${html(hero.type)}</div>`}</div><div class="buttons" style="margin-top:8px"><button class="btn fill" id="auto-turn">남은 턴 자동 진행 (테스트)</button><button class="btn fill ghost" id="leave-battle">편성으로</button></div>`)}${panel(`<div class="secthead"><h3>전투 로그</h3><span class="tag">${battle.history.length} events</span></div><div class="log">${[...battle.history].reverse().slice(0,20).map(e=>`<div class="event"><b>${e.turn}T</b><span>${html(e.card)} <span class="accent">${e.gained?'+ '+fmt(e.gained):''}</span><br>${html(e.details)}</span></div>`).join('')||'<p class="note">첫 번째 카드를 선택해주세요.</p>'}</div>`)}`}
function renderResult(){const st=stages[last.stage];return `${panel(`<div class="secthead"><h2>SECTOR 0${last.stage+1} RESULT</h2><span class="tag">${last.lab?'LAB ONLY':'SAVE'}</span></div><div class="score ${last.cleared?'clear':'fail'}">${last.cleared?'CLEAR':'FAILED'}</div><div class="score" style="font-size:32px">${fmt(last.total)}</div><p class="note" style="text-align:center">목표 ${fmt(st.goal)} · 직접 선택 ${last.history.filter(e=>!e.active).length}회</p><div class="buttons"><button class="btn fill" id="retry">재도전</button>${last.lab?'<button class="btn primary fill" id="back-lab">실험실 복귀</button>':`<button class="btn primary fill" id="claim">${last.cleared?'클리어 보상 받기':'덱 편성으로'}</button>`}</div>`)}${panel(`<h3>카드 사용 기록</h3><div class="log">${last.history.map(e=>`<div class="event"><b>${e.turn}T</b><span>${html(e.card)} · ${fmt(e.score)}점<br>${html(e.details)}</span></div>`).join('')}</div>`)} `}
function renderReward(){const options=['rapunzel','scarlet','dorothy'].filter(x=>!save.heroes.includes(x));return `${panel(`<div class="secthead"><h2>SIMULATION TERMINATED</h2><span class="tag">SCRIPT DRAFT</span></div><div class="story">구출 시뮬레이션이 완료되었습니다.<br>마리안의 실제 구출 기록: 0건.<br>사령관이 확인한 것은 시뮬레이션 속의 결과입니다.</div><p class="note warntext">위 문장은 임시 대사입니다. 최종 스토리는 제작자가 직접 검수합니다.</p><h3>전투 기록 복원 · 플레이어블 1명 선택</h3><div class="characterchoices">${options.map(id=>`<button class="choice" data-reward="${id}" style="${palette(id)}"><b>${html(characters[id].icon)} ${html(characters[id].name)}</b>${html(characters[id].type)}<br><span class="mini">${html(characters[id].edition)}</span></button>`).join('')||'<div class="note">모든 인물을 해금했습니다.</div>'}</div>${options.length?'<p class="note">선택한 한 명이 영구 해금됩니다.</p>':'<button class="btn primary full" id="reward-done">다음 시뮬레이션</button>'}`)}`}
function renderMission(){if(screen==='battle')return renderBattle();if(screen==='result')return renderResult();if(screen==='reward')return renderReward();return renderPrep()}
function renderLab(){const options=allCards(true),deck=normalizeLabDeck(save.labDeck,save.custom);return `<div class="secthead"><h2>카드 제작 · 시뮬레이터</h2><span class="tag">본편과 분리</span></div>${panel(`<h3>${editCard?'카드 수정':'실험 카드 만들기'}</h3><form id="card-form"><div class="field"><label>카드 이름</label><input name="name" maxlength="30" required value="${html(editCard?.name||'')}"></div><div class="grid2"><div class="field"><label>효과</label><select name="effect">${allowedEffects.map(k=>`<option value="${k}" ${editCard?.effect===k?'selected':''}>${effectNames[k]}</option>`).join('')}</select></div><div class="field"><label>수치 (0~999)</label><input name="value" type="number" min="0" max="999" required value="${editCard?.value??10}"></div></div><div class="buttons"><button class="btn primary fill" type="submit">${editCard?'수정 저장':'카드 추가'}</button>${editCard?'<button class="btn fill" id="cancel-edit" type="button">취소</button>':''}</div></form>`)}${panel(`<div class="secthead"><h3>직접 만든 카드 ${save.custom.length}/50</h3></div>${save.custom.length?save.custom.map(c=>`<div class="record"><span><b>${html(c.name)}</b><br><span class="mini muted">${html(effectNames[c.effect])} ${c.value}</span></span><span class="buttons"><button class="btn tiny" data-edit="${html(c.id)}">수정</button><button class="btn tiny warn" data-del="${html(c.id)}">삭제</button></span></div>`).join(''):'<p class="note">새로운 카드를 만들어 직접 드로우하며 실험할 수 있습니다.</p>'}`)}${panel(`<h3>실험할 덱 · 6장</h3><div class="grid2"><div class="field"><label>테스트 스테이지</label><select id="lab-stage">${stages.map((s,i)=>`<option value="${i}" ${save.labStage===i?'selected':''}>${i+1} · ${html(characters[s.boss].name)}</option>`).join('')}</select></div><div class="field"><label>테스트 캐릭터</label><select id="lab-hero">${['rapi','rapunzel','scarlet','dorothy'].map(k=>`<option value="${k}" ${save.labHero===k?'selected':''}>${html(characters[k].name)}</option>`).join('')}</select></div></div><div class="field"><label>고유 스킬 방식</label><select id="lab-mode"><option value="passive" ${save.labMode==='passive'?'selected':''}>패시브</option><option value="active" ${save.labMode==='active'?'selected':''}>액티브</option></select></div><div class="grid2">${deck.map((id,i)=>`<div class="field"><label>덱 카드 ${i+1}</label><select data-labslot="${i}">${options.map(c=>`<option value="${html(c.id)}" ${c.id===id?'selected':''}>${html(c.name)}</option>`).join('')}</select></div>`).join('')}</div><div class="buttons"><button class="btn fill" id="lab-copy">본편 덱 복사</button><button class="btn primary fill" id="lab-start">실험 전투 시작 ▶</button></div><button class="btn full" id="lab-batch" style="margin-top:7px">시드 100개 자동 시뮬레이션 · 점수 분포 확인</button>`)}${labResult?panel(`<h3>100회 자동 시뮬레이션 결과</h3><div class="kpis"><div class="kpi"><b>${fmt(labResult.min)}</b><span>최저</span></div><div class="kpi"><b>${fmt(labResult.avg)}</b><span>평균</span></div><div class="kpi"><b>${fmt(labResult.max)}</b><span>최고</span></div></div><p class="note">클리어 ${labResult.passed}/100 · 3장 중 즉시 점수를 가장 많이 얻는 카드를 선택한 자동 테스트입니다. 최적 전략의 증명은 아닙니다.</p>`):''}`}
function renderRecords(){return `<div class="secthead"><h2>기록 / 세이브</h2><span class="tag">LOCAL DATA</span></div>${panel(`<div class="kpis"><div class="kpi"><b>${save.runs}</b><span>4스테이지 완주</span></div><div class="kpi"><b>${save.heroes.length}/4</b><span>해금 캐릭터</span></div><div class="kpi"><b>${save.custom.length}</b><span>실험 카드</span></div></div>${stages.map((s,i)=>`<div class="record"><span>0${i+1} · ${html(characters[s.boss].name)}</span><b>${fmt(save.best[i])}</b></div>`).join('')}`)}${panel(`<h3>진행 기록 관리</h3><p class="note">카드·스테이지·캐릭터·최고 점수·실험 카드가 자동 저장됩니다. JSON 파일로 세이브를 백업할 수 있습니다.</p><div class="buttons"><button class="btn fill" id="export">JSON 내보내기</button><button class="btn fill" id="import">JSON 불러오기</button></div><input type="file" id="import-file" accept=".json,application/json" class="hidden"><button class="btn warn full" id="reset" style="margin-top:10px">전체 저장 데이터 초기화</button>`)}${panel(`<h3>테스트 빌드 상태</h3><p class="note">매 턴 3장 드로우와 직접 선택 · 12턴 · 액티브 직접 발동 · 18장 기본 카드 · 4스테이지 · 카드 제작 실험실 · 저장·복원</p><p class="note">캐릭터 이미지는 4주년 색감의 임시 실루엣입니다. 원작 이미지·음악·로고 파일을 포함하지 않았습니다. 스토리 문구는 제작자 검수 대기입니다.</p>`)}`}
function render(){document.querySelectorAll('[data-tab]').forEach(n=>n.classList.toggle('active',n.dataset.tab===page));document.getElementById('app').innerHTML=page==='mission'?renderMission():page==='lab'?renderLab():renderRecords();bind()}
function startBattle(lab=false){const deck=lab?save.labDeck:save.deck,hero=lab?save.labHero:save.hero,mode=lab?save.labMode:save.mode,stage=lab?save.labStage:save.stage;battle=newBattle({deck,hero,mode,stage,seed:save.battleSeed,lab});screen='battle';page='mission';render()}
function finishBattle(){last=completeBattle(battle);if(!battle.lab){save.best[last.stage]=Math.max(save.best[last.stage],last.total);persist()}screen='result';render()}
function claim(){if(!last||last.lab){screen='prep';render();return}if(last.cleared){save.cleared=uniq([...save.cleared,last.stage]);if(last.stage<3){save.unlockedGroups=uniq([...save.unlockedGroups,stages[last.stage].unlock]);save.unlockedStage=Math.max(save.unlockedStage,last.stage+1);save.stage=last.stage+1;save.deck=normalizeDeck(save.deck,save.unlockedGroups);screen='prep';toast('신규 카드 해금');}else{save.runs++;screen='reward';}persist()}else screen='prep';render()}
function reward(hero){if(hero&&!save.heroes.includes(hero))save.heroes.push(hero);save.stage=0;save.unlockedStage=0;save.cleared=[];save.hero=hero||save.hero;save.deck=normalizeDeck(save.deck,save.unlockedGroups);persist();screen='prep';render();toast(hero?`${characters[hero].name} 플레이어블 해금`:'시뮬레이션 기록 완료')}
function doPlay(id){playCard(battle,id);if(battle.done)finishBattle();else render()}
function autoPlay(b){while(!b.done){if(b.mode==='active'&&!b.activeUsed&&b.turn===9)useActive(b);const pick=b.hand.map(id=>{const t=Object.assign({},b,{history:[],hand:[...b.hand],drawPile:[...b.drawPile],discard:[...b.discard],bonus:[...b.bonus],rng:makeRng(1)});playCard(t,id);return {id,score:t.score}}).sort((a,c)=>c.score-a.score)[0];playCard(b,pick.id)}return completeBattle(b)}

function bindLab(on){const form=document.getElementById('card-form');if(form)form.onsubmit=e=>{e.preventDefault();const fd=new FormData(form),name=String(fd.get('name')||'').trim(),eff=String(fd.get('effect')||''),value=Number(fd.get('value'));if(!name||!allowedEffects.includes(eff)||!Number.isFinite(value)||value<0||value>999){toast('이름·효과·0~999 수치를 확인하세요');return}const c=card(editCard?.id||`custom_${Date.now()}`,name,'custom',`${effectNames[eff]} ${value}`,eff,value);if(editCard)save.custom=save.custom.map(x=>x.id===c.id?c:x);else{if(save.custom.length>=50){toast('실험 카드 최대 50장');return}save.custom.push(c)}editCard=null;persist();render();toast('카드 저장')};document.querySelectorAll('[data-edit]').forEach(el=>el.onclick=()=>{editCard=save.custom.find(c=>c.id===el.dataset.edit);render()});document.querySelectorAll('[data-del]').forEach(el=>el.onclick=()=>{const id=el.dataset.del;save.custom=save.custom.filter(c=>c.id!==id);save.labDeck=normalizeLabDeck(save.labDeck.filter(k=>k!==id),save.custom);persist();render()});on('cancel-edit',()=>{editCard=null;render()});const fields=[['lab-stage','labStage'],['lab-hero','labHero'],['lab-mode','labMode']];for(const [id,key] of fields){const el=document.getElementById(id);if(el)el.onchange=()=>{save[key]=key==='labStage'?Number(el.value):el.value;persist();render()}}document.querySelectorAll('[data-labslot]').forEach(el=>el.onchange=()=>{const ix=Number(el.dataset.labslot),id=el.value,idx=save.labDeck.indexOf(id);if(idx>=0)[save.labDeck[idx],save.labDeck[ix]]=[save.labDeck[ix],save.labDeck[idx]];else save.labDeck[ix]=id;persist();render()});on('lab-copy',()=>{save.labDeck=[...save.deck];persist();render();toast('본편 덱을 복사했습니다')});on('lab-start',()=>startBattle(true));on('lab-batch',()=>{let min=Infinity,max=-Infinity,sum=0,passed=0;for(let i=0;i<100;i++){const b=newBattle({deck:save.labDeck,hero:save.labHero,mode:save.labMode,stage:save.labStage,seed:1000+i,lab:true});const r=autoPlay(b);min=Math.min(min,r.total);max=Math.max(max
