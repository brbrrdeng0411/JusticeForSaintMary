const START=['r_open','r_hold','r_chain','r_finish','reload','shot'];const defaultSave=()=>({version:2,stage:0,available:['base','rapi'],heroes:['rapi'],hero:'rapi',mode:'passive',deck:START.slice(),completed:[],runs:0,best:[0,0,0,0],custom:[],labStage:0,labHero:'rapi',labMode:'passive'});let store;try{store=JSON.parse(localStorage.getItem(KEY)||'null')}catch{};store={...defaultSave(),...(store||{})};const unique=a=>[...new Set(a)];store.heroes=unique(store.heroes||['rapi']);store.available=unique(store.available||['base','rapi']);store.completed=unique(store.completed||[]);if(!Array.isArray(store.custom))store.custom=[];if(!Array.isArray(store.deck)||store.deck.length!==6)store.deck=START.slice();if(!Array.isArray(store.best))store.best=[0,0,0,0];

function simulate(loadout,stageId,{strict=false}={}){const deck=loadout.deck,hero=loadout.hero,mode=loadout.mode,stage=STAGES[stageId];if(strict&&!legalDeck(deck,hero,mode))throw Error('현재 보유한 카드를 6장 선택해야 합니다.');if(deck.length!==6)throw Error('6장 덱이 필요합니다.');const s={score:0,hojo:0,impression:0,lock:0,shield:0,reserve:0,strong:0,next:0,bonus:[],maxHit:0,turn:0,passiveFlat:0};const events=[];function gain(v,kind,parts){const p=Math.max(0,Math.floor(v));s.score+=p;parts.push(`${kind} +${fmt(p*100)}`);return p}function attack(v,parts,label='공격'){playerPassive(s,hero,mode,'attack');let amount=Math.max(0,v+s.next+s.passiveFlat);s.next=0;s.passiveFlat=0;if(s.hojo>0)amount=Math.floor(amount*1.5);if(s.strong>0){amount*=2;s.strong-=1}let got=gain(amount,label,parts);s.maxHit=Math.max(s.maxHit,got);if(stageId===3&&s.turn===10&&got>=50&&!s.bonus.includes('queen')){gain(80,'QUEEN BREAK',parts);s.bonus.push('queen')}}function effect(c,parts){const v=Number(c.value)||0,x=Number(c.extra)||0;switch(c.effect){case'attack':attack(v,parts);break;case'reload':attack(v,parts);s.next+=x;break;case'hojo':s.hojo+=v;parts.push(`호조 +${v}T`);break;case'hold':s.hojo+=v;attack(x,parts);break;case'chain':attack(v+(s.hojo>0?x:0),parts);break;case'impression':s.impression+=v;playerPassive(s,hero,mode,'impression');parts.push(`호인상 +${v}`);break;case'lock':s.lock+=v;parts.push(`호인상 유지 ${v}T`);break;case'imBurst':attack(s.impression*v,parts);s.impression=Math.floor(s.impression/2);break;case'shield':s.shield+=v;playerPassive(s,hero,mode,'shield');parts.push(`보호막 +${v}`);break;case'shieldAtk':s.shield+=v;playerPassive(s,hero,mode,'shield');attack(x,parts);break;case'shieldMult':s.shield=Math.floor(s.shield*v);parts.push(`보호막 ×${v}`);break;case'shieldBurst':attack(s.shield*v,parts);s.shield=0;break;case'reserve':s.reserve+=v;playerPassive(s,hero,mode,'reserve');parts.push(`비축 +${v}`);break;case'strong':s.strong+=v;parts.push(`강기 ${v}회`);break;case'reserveBurst':attack(x+s.reserve*v,parts);s.reserve=0;s.strong=0;break;case'heroRapi':s.hojo+=v;s.next+=x;parts.push('호조 전개 / 공격 강화');break;case'heroRap':s.impression+=v;gain(s.impression*x,'생츄어리',parts);break;case'heroScar':gain(s.shield*v,'신살',parts);s.shield=0;break;case'heroDor':gain(s.reserve*v,'낙원',parts);s.reserve=0;break;case'customAttack':attack(v,parts);break;case'customHojo':s.hojo+=v;parts.push(`호조 +${v}`);break;case'customImpression':s.impression+=v;parts.push(`호인상 +${v}`);break;case'customShield':s.shield+=v;playerPassive(s,hero,mode,'shield');parts.push(`보호막 +${v}`);break;case'customReserve':s.reserve+=v;playerPassive(s,hero,mode,'reserve');parts.push(`비축 +${v}`);break;case'customMult':s.next+=v;parts.push(`다음 공격 +${v}`);break;case'customBurstShield':attack(s.shield*v,parts);s.shield=0;break;case'customBurstReserve':attack(s.reserve*v,parts);s.reserve=0;break;default:throw Error('알 수 없는 카드 효과: '+c.effect)}}
for(let t=1;t<=12;t++){s.turn=t;const parts=[];const before=s.score;if(stageId===2&&(t===4||t===10)){s.shield=Math.max(0,s.shield-8);parts.push('방어 교란 -8')}const c=lookup(deck[(t-1)%6]);if(!c)throw Error('없는 카드: '+deck[(t-1)%6]);effect(c,parts);if(stageId===0&&t===4&&s.hojo>0){gain(20,'호조 특수점수',parts)}if(stageId===1&&t===6&&s.impression>=4){gain(40,'성역 돌파',parts)}if(stageId===2&&t===8&&s.shield>=20){gain(50,'불굴',parts)}if(s.impression>0){gain(s.impression*3+(mode==='passive'&&hero==='rapunzel'?s.impression*2:0),'호인상 지속',parts)}if(s.hojo>0)s.hojo--;if(s.lock>0)s.lock--;else if(s.impression>0)s.impression--;events.push({turn:t,card:c.name,gained:(s.score-before)*100,total:s.score*100,details:parts.join(' · '),snapshot:{hojo:s.hojo,impression:s.impression,shield:s.shield,reserve:s.reserve,strong:s.strong}})}return {total:s.score*100,cleared:s.score*100>=stage.target,events,state:s,stage:stageId,hero,mode,deck:deck.slice(),target:stage.target}}
function panel(content,cls=''){return `<section class="panel ${cls}">${content}</section>`}function portrait(key,compact=false){const c=CHARS[key];return `<div class="char-hero" style="--char-main:${c.main};--char-soft:${c.soft}"><div class="char-art" aria-label="${esc(c.name)} 테마 자리표시자"><span>${esc(c.type)}</span></div><div class="char-text"><div class="en">${esc(c.subtitle)}</div><h3>${esc(c.name)}</h3><small>${esc(c.blurb)}</small></div></div>`}

${panel(`<div class="sectionhead"><h2>플레이어블 선택</h2><span class="pill">${store.heroes.length}/4 UNLOCKED</span></div><div class="charactergrid">${['rapi','rapunzel','scarlet','dorothy'].map(k=>`<button class="person ${selected===k?'active':''} ${store.heroes.includes(k)?'':'locked'}" data-hero="${k}" ${store.heroes.includes(k)?'':'disabled'}><i class="dot" style="--dot:${CHARS[k].main}"></i><b>${CHARS[k].name}</b><span>${CHARS[k].type}</span></button>`).join('')}</div><div class="row" style="margin-top:11px"><button class="btn smallbtn ${store.mode==='passive'?'primary':'ghost'} col" data-mode="passive">패시브 상시</button><button class="btn smallbtn ${store.mode==='active'?'primary':'ghost'} col" data-mode="active">액티브 카드</button></div><p class="help">${store.mode==='active'?'액티브는 덱 6칸 중 하나에 배치하여 카드 순서대로 자동 발동합니다. 예약 턴·수동 터치가 없습니다.':'패시브는 캐릭터 고유 효과가 매 턴 자동 적용됩니다.'}</p>`)}
${panel(`<div class="sectionhead"><h2>전술 시퀀스 / 6 SLOTS</h2><span class="pill">12 TURN × 2 CYCLES</span></div><div class="slotgrid">${store.deck.map((id,i)=>`<button class="slot ${selectedSlot===i?'selected':''}" data-slot="${i}"><b>0${i+1}</b><span>${esc(lookup(id)?.name||'비어 있음')}</span></button>`).join('')}</div><p class="help">슬롯을 먼저 선택하고 아래 카드를 누르면 교체합니다. 다른 슬롯을 선택하면 두 슬롯의 순서가 바뀝니다.</p><div class="sectionhead"><h2 class="small">보유 카드 목록</h2><span class="mini muted">${cards.length} CARDS</span></div><div class="cardlist">${cards.map(c=>`<button class="card ${store.deck.includes(c.id)?'chosen':''}" data-card="${esc(c.id)}" style="--stripe:${CHARS[c.kind]?.main||'#64c3d5'}"><div class="stripe"></div><span class="n">${esc(c.kind.toUpperCase())}</span><b>${esc(c.name)}</b><small>${esc(c.desc)}</small></button>`).join('')}</div><div class="row" style="margin-top:11px"><button class="btn smallbtn col" id="reset-deck">기본 배치</button><button class="btn primary col" id="start-battle">시뮬레이션 시작 ▶</button></div>`,'corner')}
<div class="footer">FAN PROTOTYPE · FICTIONAL COMBAT SIMULATION · ORIGINAL CODE</div>`}
function renderBattle(){const r=sim;const st=STAGES[r.stage];const ev=r.events[Math.min(frame-1,11)],score=ev?.total||0;return `<div class="sectionhead"><h2>TACTICAL REPLAY</h2><span class="pill">TURN ${Math.min(frame,12)}/12</span></div>${panel(`<div class="statusbar"><span>실시간 작전 점수</span><b>${fmt(st.target)} PTS 목표</b></div><div class="bigscore" id="battle-score">${fmt(score)}</div><div class="progress"><i style="width:${Math.min(100,score/st.target*100)}%"></i></div><div class="battlepic" style="margin-top:12px">${portrait(r.hero,true)}${portrait(st.boss,true)}</div><div class="sectionhead" style="margin-top:12px"><strong id="now-card">${esc(ev?.card||'대기 중')}</strong><span class="pill">AUTO PLAY</span></div><p class="help" id="now-details">${esc(ev?.details||'카드가 순차적으로 발동합니다.')}</p><div class="row"><button class="btn col" id="speed">속도 ${playSpeed===1?'1×':'3×'}</button><button class="btn primary col" id="skip">결과로 건너뛰기 ≫</button></div>`)}${panel(`<div class="sectionhead"><h2>전투 로그</h2></div><div class="log" id="battle-log">${r.events.slice(0,frame).map(e=>`<div class="event"><b>${e.turn}T</b><span>${esc(e.card)} · <span class="positive">+${fmt(e.gained)}</span><br><span class="muted">${esc(e.details)}</span></span></div>`).join('')}</div>`)}`}

function renderLab(){const options=universe(),safe=store.custom;const testDeck=store.labDeck?.length===6?store.labDeck.slice():store.deck.slice();const stage=store.labStage||0;const hero=store.labHero||'rapi';const mode=store.labMode||'passive';return `<div class="sectionhead"><h2>카드 제작 · 시뮬레이터</h2><span class="pill">DESIGN LAB</span></div>${panel(`<p class="help">수치를 직접 입력해 실험용 카드를 추가한 뒤 덱에 넣어 12턴 점수를 계산합니다. 카드·덱·결과는 브라우저에 저장됩니다. 실험 카드 효과는 현재 8종을 지원합니다.</p><form id="lab-form"><div class="field"><label>카드 이름</label><input name="name" required maxlength="20" placeholder="예: 호조 공명" value="${esc(labEdit?.name||'')}"></div><div class="labgrid"><div class="field"><label>카드 종류</label><select name="effect">${Object.entries({customAttack:'직접 공격',customHojo:'호조 지속 +',customImpression:'호인상 +',customShield:'보호막 +',customReserve:'비축 +',customMult:'다음 공격 고정 +',customBurstShield:'보호막 ×배수 공격',customBurstReserve:'비축 ×배수 공격'}).map(([k,v])=>`<option value="${k}" ${labEdit?.effect===k?'selected':''}>${v}</option>`).join('')}</select></div><div class="field"><label>효과 수치</label><input name="value" type="number" required min="0" max="999" value="${labEdit?.value??10}"></div></div><button class="btn primary full" type="submit" style="margin-top:10px">${labEdit?'카드 수정 저장':'새 실험 카드 추가'} +</button></form>`)}

${labResult?panel(`<div class="sectionhead"><h2>실험 결과</h2><span class="pill">${labResult.cleared?'PASS':'FAIL'}</span></div><div class="bigscore">${fmt(labResult.total)}</div><div class="small" style="text-align:center">목표 ${fmt(labResult.target)}</div><div class="log">${labResult.events.map(e=>`<div class="event"><b>${e.turn}T</b><span>${esc(e.card)} · +${fmt(e.gained)}<br><span class="muted">${esc(e.details)}</span></span></div>`).join('')}</div>`):''}`}
function renderRecords(){return `<div class="sectionhead"><h2>진행 기록 / 세이브</h2><span class="pill">LOCAL STORAGE</span></div>${panel(`<div class="split"><div class="kpi"><b>${store.runs}</b><span>전체 완주 횟수</span></div><div class="kpi"><b>${store.heroes.length}/4</b><span>플레이어블 해금</span></div></div><div class="hr"></div><table class="table"><thead><tr><th>스테이지</th><th>최고점</th></tr></thead><tbody>${STAGES.map((s,i)=>`<tr><td>${i+1}. ${CHARS[s.boss].name} ${store.completed.includes(i)?'✓':''}</td><td>${fmt(store.best[i]||0)}</td></tr>`).join('')}</tbody></table><p class="help">클리어 보상·카드 해금·플레이어블·완주 횟수·덱·실험 카드가 브라우저에 자동 저장됩니다.</p>`)}${panel(`<div class="sectionhead"><h2>저장 데이터 관리</h2></div><div class="row"><button class="btn col" id="save-export">세이브 JSON 내보내기</button><button class="btn col" id="save-import">JSON 불러오기</button></div><input id="import-file" class="hidden" type="file" accept=".json,application/json"><button class="btn danger full" id="save-reset" style="margin-top:10px">모든 저장 데이터 초기화</button>`)}${panel(`<div class="sectionhead"><h2>현재 빌드</h2></div><p class="help">빌드: 2026-11-06 / 단일 HTML · 온라인 연결 불필요 · 4스테이지 · 18장 기본 카드 · 사용자 카드 에디터 · 순차 발동 자동전투</p><p class="help">원작의 공식 이미지·음원·로고를 파일에 포함하지 않았습니다. 색채와 시뮬레이션 룸의 구조적 분위기를 참조한 팬 테스트입니다.</p>`)}`}
function bind(){document.querySelectorAll('[data-stage]').forEach(b=>b.onclick=()=>{activeStage=+b.dataset.stage;render()});document.querySelectorAll('[data-hero]').forEach(b=>b.onclick=()=>{store.hero=b.dataset.hero;normalizeDeck();persist();render()});document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{store.mode=b.dataset.mode;normalizeDeck();persist();render()});document.querySelectorAll('[data-slot]').forEach(b=>b.onclick=()=>{const n=+b.dataset.slot;if(selectedSlot<0){selectedSlot=n}else if(selectedSlot!==n){[store.deck[selectedSlot],store.deck[n]]=[store.deck[n],store.deck[selectedSlot]];selectedSlot=-1;persist()}else selectedSlot=-1;render()});document.querySelectorAll('[data-card]').forEach(b=>b.onclick=()=>{const id=b.dataset.card;if(selectedSlot<0){toast('먼저 1~6번 슬롯을 선택하세요');return}if(store.deck.includes(id)){const other=store.deck.indexOf(id);[store.deck[selectedSlot],store.deck[other]]=[store.deck[other],store.deck[selectedSlot]]}else store.deck[selectedSlot]=id;selectedSlot=-1;persist();render()});const on=(id,fn)=>{const b=document.getElementById(id);if(b)b.onclick=fn};on('reset-deck',()=>{store.deck=START.filter(id=>owned(lookup(id)));const fallback=universe().filter(owned).map(c=>c.id);for(const id of fallback)if(store.deck.length<6&&!store.deck.includes(id))store.deck.push(id);selectedSlot=-1;persist();render()});on('start-battle',()=>{if(!legalDeck(store.deck)){toast('보유 카드 6장을 중복 없이 선택하세요');return}sim=simulate({deck:store.deck,hero:store.hero,mode:store.mode},activeStage,{strict:true});view='battle';frame=0;playSpeed=1;render();ticker()});on('speed',()=>{playSpeed=playSpeed===1?3:1;ticker();render()});on('skip',()=>endBattle());on('retry',()=>{view='prep';activeStage=lastResult.stage;render()});on('claim',()=>{if(!lastResult.cleared){view='prep';render();return}claim(lastResult)});document.querySelectorAll('[data-reward]').forEach(b=>b.onclick=()=>finishReward(b.dataset.reward));on('reward-finish',()=>finishReward(null));bindLab(on);on('save-export',()=>{const blob=new Blob([JSON.stringify(store,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='JusticeForSaintMary-save.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),4000)});on('save-import',()=>document.getElementById('import-file').click());const f=document.getElementById('import-file');if(f)f.onchange=async()=>{try{const j=JSON.parse(await f.files[0].text());if(!Array.isArray(j.heroes)||!Array.isArray(j.deck)||!Array.isArray(j.available))throw Error('잘못된 세이브');store={...defaultSave(),...j};persist();activeStage=Math.min(3,store.stage);render();toast('세이브 복원 완료')}catch(e){toast('불러오기 실패: '+e.message)}};on('save-reset',()=>{if(confirm('모든 진행 기록과 제작 카드를 초기화할까요?')){store=defaultSave();persist();activeStage=0;view='prep';labResult=null;render()}})}
function normalizeDeck(){const allowed=universe().filter(owned).map(c=>c.id);if(store.mode==='active')allowed.push(CHARS[store.hero].active.id);store.deck=unique(store.deck.filter(id=>allowed.includes(id)));for(const id of allowed)if(store.deck.length<6&&!store.deck.includes(id))store.deck.push(id);store.deck=store.deck.slice(0,6);selectedSlot=-1}
let playSpeed=1;function ticker(){clearInterval(clock);clock=setInterval(()=>{frame=Math.min(12,frame+1);if(frame>=12){clearInterval(clock);setTimeout(()=>{if(view==='battle')endBattle()},220)}else render()},playSpeed===1?430:135)}function endBattle(){clearInterval(clock);if(!sim)return;lastResult=sim;view='result';store.best[sim.stage]=Math.max(store.best[sim.stage]||0,sim.total);persist();render()}
function claim(r){if(r.cleared){store.completed=unique([...store.completed,r.stage]);if(r.stage<3){if(STAGES[r.stage].unlocks)store.available=unique([...store.available,STAGES[r.stage].unlocks]);store.stage=Math.max(store.stage,r.stage+1);activeStage=Math.min(3,r.stage+1);normalizeDeck();persist();toast('카드 해금 · 다음 스테이지 개방');view='prep'}else{store.runs+=1;persist();view='reward'}}else view='prep';render()}
function finishReward(hero){if(hero&&!store.heroes.includes(hero))store.heroes.push(hero);store.stage=0;activeStage=0;store.completed=[];persist();view='prep';render();toast(hero?`${CHARS[hero].name} 플레이어블 해금`:'전체 기록 저장 완료')}
function bindLab(on){const form=document.getElementById('lab-form');if(form)form.onsubmit=e=>{e.preventDefault();const fd=new FormData(form);const name=String(fd.get('name')).trim(),effect=String(fd.get('effect'));const value=Number(fd.get('value'));if(!name||!Number.isFinite(value)||value<0||value>999)return toast('이름과 0~999 수치를 입력하세요');const descriptions={customAttack:'직접 공격',customHojo:'호조 +',customImpression:'호인상 +',customShield:'보호막 +',customReserve:'비축 +',customMult:'다음 공격 +',customBurstShield:'보호막 ×',customBurstReserve:'비축 ×'};const payload=card(labEdit?.id||'custom_'+Date.now(),name,'custom',descriptions[effect]+value,effect,value);if(labEdit){store.custom=store.custom.map(c=>c.id===labEdit.id?payload:c)}else{if(store.custom.length>=50)return toast('실험 카드는 최대 50장입니다');store.custom.push(payload)}labEdit=null;persist();render();toast('카드 저장 완료')};document.querySelectorAll('[data-labedit]').forEach(b=>b.onclick=()=>{labEdit=store.custom.find(c=>c.id===b.dataset.labedit);render()});document.querySelectorAll('[data-labdel]').forEach(b=>b.onclick=()=>{const id=b.dataset.labdel;store.custom=store.custom.filter(c=>c.id!==id);store.deck=store.deck.map(c=>c===id?'shot':c);if(store.labDeck)store.labDeck=store.labDeck.map(c=>c===id?'shot':c);normalizeDeck();persist();render()});const ls=document.getElementById('lab-stage'),lh=document.getElementById('lab-hero'),lm=document.getElementById('lab-mode');if(ls)ls.onchange=()=>{store.labStage=+ls.value;persist()};if(lh)lh.onchange=()=>{store.labHero=lh.value;persist();render()};if(lm)lm.onchange=()=>{store.labMode=lm.value;persist();render()};document.querySelectorAll('.lab-slot').forEach(b=>b.onchange=()=>{const arr=store.labDeck?.length===6?store.labDeck.slice():store.deck.slice();arr[+b.dataset.index]=b.value;store.labDeck=arr;persist()});on('lab-from-main',()=>{store.labDeck=store.deck.slice();persist();render();toast('현재 덱을 실험실로 복사했습니다')});on('lab-run',()=>{const deck=[...document.querySelectorAll('.lab-slot')].map(n=>n.value);if(new Set(deck).size!==6)return toast('서로 다른 카드 6장을 골라주세요');store.labDeck=deck;persist();try{labResult=simulate({deck,hero:store.labHero||'rapi',mode:store.labMode||'passive'},store.labStage||0);render()}catch(e){toast(e.message)}})}
document.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>{clearInterval(clock);page=b.dataset.tab;view='prep';render()}));window.JFSM_TEST={simulate,BASE,CHARS,STAGES,getSave:()=>JSON.parse(JSON.stringify(store)),saveKey:KEY,defaultSave};persist();render();
})();
</script></body></html>
